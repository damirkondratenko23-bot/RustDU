[package]
name = "rustdu"
version = "0.2.1"
edition = "2024"
description = "A fast, interactive terminal disk usage analyzer"
authors = ["damirkondratenko23@gmail.com"]
license = "MIT"
repository = "https://github.com/damirkondratenko23-bot/rustdu"
readme = "README.md"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
once_cell = "1"

[[bin]]
name = "rustdu"
path = "src/main.rs"